name: Recipe CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax
        run: |
          # bash -n takes ONE script; extra arguments become positional parameters, so
          # "bash -n scripts/*.sh" only ever parsed the first file. Loop instead.
          for f in scripts/*.sh one-spark-tp1/scripts/*.sh; do
            bash -n "$f"
          done

      - name: Python syntax
        run: |
          for f in scripts/*.py tests/*.py one-spark-tp1/scripts/*.py; do
            python -m py_compile "$f"
          done

      - name: JSON syntax
        run: |
          python -m json.tool configs/quantization_config.example.json >/dev/null
          python -m json.tool runtime.lock.json >/dev/null
          for f in attestations/*.json; do
            python -m json.tool "$f" >/dev/null
          done

      - name: Runtime and deployment contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

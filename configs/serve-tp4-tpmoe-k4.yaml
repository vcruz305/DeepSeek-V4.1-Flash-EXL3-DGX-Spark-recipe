# Serve config captured from the measured 4x Spark TP4 + TP-MoE deployment
# (2026-09-24, k=4, code-heavy / low-concurrency variant).
#
# Source: /tmp/serve-tp4-d203.yaml.opus-k4-c10 inside the `dsv41-tp4`
# container on the vLLM server node. profiles/tp4-tpmoe-k4.env reproduces it
# through scripts/serve_tp4.sh (MOE_PARALLEL_MODE=tp).
#
# k=4 is DSpark's trained max at dspark_block_size=5, so this is the widest
# drafter this checkpoint supports. Same requirements as
# configs/serve-tp4-tpmoe-k2.yaml: vllm-exl3 PR #36 + PR #37.
model: /models/dsv41-orig
quantization: exl3
tokenizer-mode: deepseek_v41
tensor-parallel-size: 4
enable-expert-parallel: false
enable-ep-weight-filter: false
distributed-executor-backend: ray
language-model-only: true
tool-call-parser: deepseek_v41
enable-auto-tool-choice: true
reasoning-parser: deepseek_v41
served-model-name: deepseek-v41-exl3
host: 0.0.0.0
port: 8002
gpu-memory-utilization: 0.55
kv-cache-memory-bytes: 8589934592
max-model-len: 1048576
max-num-seqs: 10
max-num-batched-tokens: 4096
block-size: 128
enforce-eager: false
trust-remote-code: true
enable-prefix-caching: true
engram-config:
  cpu_offload: false
speculative-config:
  method: dspark
  num_speculative_tokens: 4
  draft_sample_method: probabilistic
  rejection_sample_method: block
  quantization: mxfp4
compilation-config:
  cudagraph_mode: FULL_DECODE_ONLY
  cudagraph_capture_sizes: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50]

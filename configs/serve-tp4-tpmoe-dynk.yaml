# Serve config captured from the measured 4x Spark TP4 + TP-MoE deployment
# (2026-09-24, dynamic speculative length, production-champion default for
# mixed traffic, replacing the fixed k=3 default).
#
# Source: /tmp/serve-tp4-d203.yaml.CHAMPION inside the `dsv41-tp4` container
# on the vLLM server node. profiles/tp4-tpmoe-dynk.env reproduces it through
# scripts/serve_tp4.sh (MOE_PARALLEL_MODE=tp).
#
# Runtime identity of the captured run:
#   topology        TP4 (MoE-TP4, EP1) over 4x GB10
#   vllm-exl3       requires vcruz305/vllm-exl3 PR #36 (Hadamard-aligned
#                   uneven TP MoE, VLLM_EXL3_MOE_TP_ALIGN=128), PR #37
#                   (padded-MoE loops bounded by n_valid), and PR #39
#                   (padded-MoE expert-grouped stage1/5: decode each
#                   trellis tile once per expert instead of once per slot)
#   bench           llm-inference-bench v0.4.29, chat code prompts,
#                   thinking disabled, temperature 0.6, 60s sustained cells
#   cold load       ~9 minutes
#
# Unlike the EP4 path (configs/serve-tp4-live.yaml), this profile disables
# expert parallelism and the EP weight filter and routes MoE through tensor
# parallelism instead, relying on PR #36/#37/#39 to keep the padded MoE
# kernel correct and fast at the resulting uneven per-rank expert widths.
#
# Dynamic speculative length: DSpark schedules num_speculative_tokens per
# step from num_speculative_tokens_per_batch_size, picking k=4 for small
# batches (1-4 concurrent sequences) and k=3 for larger ones (5-10), instead
# of a single fixed k for the whole run. See
# four-spark-tp4/README.md#dynamic-speculative-length for why this beats
# either fixed k across the full concurrency range.
model: /models/dsv41-orig
quantization: exl3
tokenizer-mode: deepseek_v41
tensor-parallel-size: 4
enable-expert-parallel: false
enable-ep-weight-filter: false
distributed-executor-backend: ray
language-model-only: true
tool-call-parser: deepseek_v41
enable-auto-tool-choice: true
reasoning-parser: deepseek_v41
served-model-name: deepseek-v41-exl3
host: 0.0.0.0
port: 8002
gpu-memory-utilization: 0.55
kv-cache-memory-bytes: 8589934592
max-model-len: 1048576
max-num-seqs: 10
max-num-batched-tokens: 4096
block-size: 128
enforce-eager: false
trust-remote-code: true
enable-prefix-caching: true
engram-config:
  cpu_offload: false
speculative-config:
  method: dspark
  num_speculative_tokens: 4
  num_speculative_tokens_per_batch_size: [[1, 4, 4], [5, 10, 3]]
  draft_sample_method: probabilistic
  rejection_sample_method: block
  quantization: mxfp4
compilation-config:
  cudagraph_mode: FULL_DECODE_ONLY
  cudagraph_capture_sizes: [5, 10, 15, 20, 24, 28, 32, 36, 40]
